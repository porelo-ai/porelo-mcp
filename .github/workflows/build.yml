# Builds porelo-mcp on every change: compiled, unit tests run, the shared checks of the root's validate, and the native
# executable in its DEB and RPM, each unpacked and run. Nothing goes to Maven Central: porelo-mcp is a native executable
# in packages of its own, and nothing builds against an artifact here. Against porelo-parent as a snapshot while it is one (-U takes the newest), as the shared rules allow.
name: Build

on:
    push:
        branches: [main]
        tags: ['v*']
        # A change to documents alone is checked locally before the hand-over and by the Shared rules check once a day.
        # Workflows alone build nothing either: an action's move is checked by its pull request, and the next push with
        # content builds with it.
        paths-ignore: ['**.md', 'doc/**', 'issues/**', '.github/**']
    pull_request:
        # A workflow-only change is the Workflow check's, a change to documents alone the Shared rules check's.
        paths-ignore: ['**.md', 'doc/**', 'issues/**', '.github/**']
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    build:
        name: Build and test
        # Pinned, not ubuntu-latest.
        runs-on: ubuntu-24.04
        # A run takes about 5 minutes with the native build; a slow runner must end, not run for GitHub's six hours.
        timeout-minutes: 35
        steps:
            # Every commit, so the pushed range can be read.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: The pinned GraalVM
              uses: ./.github/actions/pinned-jdk

            # Publishing is switched by a variable, true where the packages are published and false where they are not;
            # one missing or misspelt would leave them unpublished without a word.
            - name: Whether this forge publishes
              env:
                  PORELO_PUBLISH: ${{ vars.PORELO_PUBLISH }}
              run: |
                  case "$PORELO_PUBLISH" in
                      true | false) echo "PORELO_PUBLISH=$PORELO_PUBLISH" ;;
                      *) echo "::error::vars.PORELO_PUBLISH is '$PORELO_PUBLISH', neither true nor false"; exit 1 ;;
                  esac

            # rpm to read the .rpm in the package tests, zlib's headers for the native image: the pinned runner image
            # carries both, so nothing is fetched from the Ubuntu mirrors, whose outages turned Builds red.
            - name: The packaging tools, from the runner image
              run: |
                  set -euo pipefail
                  missing=0
                  for package in rpm zlib1g-dev; do
                      status=$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null || true)
                      if [ "$status" != "install ok installed" ]; then
                          echo "::error::dpkg-query $package answered '$status', not 'install ok installed'"
                          missing=1
                      fi
                  done
                  exit "$missing"

            # main publishes snapshots and a tag a release; each refuses the other's version, so a release is never a
            # snapshot by mistake and a snapshot never takes a release's number.
            - name: Which channel
              id: channel
              env:
                  RUN_NUMBER: ${{ github.run_number }}
              run: |
                  set -euo pipefail
                  version="$(sed -n 's|^    <version>\(.*\)</version>$|\1|p' pom.xml | head -1)"
                  [ -n "$version" ] || { echo "::error::no version in pom.xml"; exit 1; }
                  if [ "$GITHUB_REF_TYPE" = tag ]; then
                      case "$version" in *-SNAPSHOT) echo "::error::a tag on a snapshot version: $version"; exit 1 ;; esac
                      echo "channel=releases" >> "$GITHUB_OUTPUT"
                      # In the pom itself, not as -D: the rpm plugin takes the pom's own value over one given there.
                      sed -i -e "s|<deb.version>.*</deb.version>|<deb.version>${version}</deb.version>|" server/pom.xml
                      echo "args=" >> "$GITHUB_OUTPUT"
                  else
                      case "$version" in *-SNAPSHOT) ;; *) echo "::error::a branch carries a release version: $version"; exit 1 ;; esac
                      echo "channel=snapshots" >> "$GITHUB_OUTPUT"
                      echo "args=-Dporelo.snapshot.run=$RUN_NUMBER -Dporelo.snapshot.suffix=" >> "$GITHUB_OUTPUT"
                  fi

            # validate runs check-actions, check-shared, check-citations and check-readmes; -Pnative builds the executable
            # and both packages, and its integration tests run the executable unpacked from each.
            - name: Build, unit tests, the shared checks, and the packages
              run: ./mvnw -B -U -s settings.xml -Pnative verify ${{ steps.channel.outputs.args }}

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: packages
                  path: |
                      server/target/*.deb
                      server/target/*.rpm
                  if-no-files-found: error

            # porelo-release's artifactory command, the one upload helper (porelo-buildtools' doc/publishing.md), at the
            # version the parent names.
            - name: The publishing tools
              if: vars.PORELO_PUBLISH == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
              run: ./mvnw -B -q -Pci-tools -s settings.xml -N dependency:build-classpath -Dmdep.outputFile="$RUNNER_TEMP/tools-cp.txt"

            # Only what main or a release tag builds is published; a pull request's packages stay an artifact. The
            # properties put a .deb into the channel's index: without them it is stored, never listed.
            - name: Publish the packages
              timeout-minutes: 20
              if: vars.PORELO_PUBLISH == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
              env:
                  JF_URL: ${{ vars.JF_URL }}
                  JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
                  CHANNEL: ${{ steps.channel.outputs.channel }}
              run: |
                  set -euo pipefail
                  art() { java -cp "$(cat "$RUNNER_TEMP/tools-cp.txt")" org.fuin.porelo.release.Main artifactory "$@"; }
                  base="${JF_URL%/}/artifactory"
                  # A release is uploaded once: a version already in the releases index is refused, never replaced.
                  if [ "$CHANNEL" = releases ]; then
                      for p in server/target/*.deb; do
                          if curl -sfL "$base/porelo-dist-deb/dists/releases/main/binary-amd64/Packages" \
                              | grep -qxF "Filename: pool/main/p/porelo-mcp/$(basename "$p")"; then
                              echo "::error::$(basename "$p") is released already"; exit 1
                          fi
                      done
                  fi
                  for p in server/target/*.deb; do
                      art put "$p" porelo-dist-deb/pool/main/p/porelo-mcp/ \
                          "deb.distribution=${CHANNEL};deb.component=main;deb.architecture=amd64"
                  done
                  for p in server/target/*.rpm; do
                      art put "$p" "porelo-dist-rpm/${CHANNEL}/"
                  done

            # Artifactory indexes after the upload, by itself and without a word when it fails, so the index is read back,
            # as a machine installing from it reads it, until it names the very files just uploaded.
            - name: The packages are indexed, not merely stored
              timeout-minutes: 12
              if: vars.PORELO_PUBLISH == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
              env:
                  JF_URL: ${{ vars.JF_URL }}
                  CHANNEL: ${{ steps.channel.outputs.channel }}
              run: |
                  set -euo pipefail
                  base="${JF_URL%/}/artifactory"
                  missing() {
                      curl -sfL "$base/porelo-dist-deb/dists/${CHANNEL}/main/binary-amd64/Packages" > "$RUNNER_TEMP/Packages" \
                          || : > "$RUNNER_TEMP/Packages"
                      for p in server/target/*.deb; do
                          grep -qxF "Filename: pool/main/p/porelo-mcp/$(basename "$p")" "$RUNNER_TEMP/Packages" \
                              || echo "porelo-dist-deb: $(basename "$p")"
                      done
                      primary=$(curl -sfL "$base/porelo-dist-rpm/${CHANNEL}/repodata/repomd.xml" \
                          | grep -o 'href="repodata/[^"]*primary\.xml\.gz"' | cut -d'"' -f2 || true)
                      { [ -n "$primary" ] && curl -sfL "$base/porelo-dist-rpm/${CHANNEL}/$primary" | gunzip; } > "$RUNNER_TEMP/primary.xml" \
                          || : > "$RUNNER_TEMP/primary.xml"
                      for p in server/target/*.rpm; do
                          grep -qF "$(basename "$p")\"" "$RUNNER_TEMP/primary.xml" || echo "porelo-dist-rpm: $(basename "$p")"
                      done
                  }
                  for i in $(seq 60); do
                      left=$(missing)
                      [ -z "$left" ] && { echo "indexed after about $(( (i - 1) * 10 )) s"; exit 0; }
                      sleep 10
                  done
                  echo "::error::uploaded, but not in the ${CHANNEL} index after ten minutes:"
                  echo "$left"
                  exit 1

            # A direct push to main never meets the pull request's check, so the push's own range is read here, by the
            # rule this commit carries. A tag checks the commit it names alone, a first commit too. The push that creates main names no start (all
            # zeros), so main's whole history is read. Another new branch or a branch pushed over has no start this checkout
            # holds, so its range starts at main; main itself cannot be pushed over.
            - name: The pushed commits' messages
              if: github.event_name == 'push'
              env:
                  PUSH_BEFORE: ${{ github.event.before }}
              run: |
                  set -eu
                  case "$PUSH_BEFORE" in
                      '') echo "::error::the push names no commit it started from"; exit 1 ;;
                  esac
                  range="$PUSH_BEFORE..$GITHUB_SHA"
                  if [ "$GITHUB_REF_TYPE" = tag ]; then
                      range="$GITHUB_SHA^!"
                  elif [ "$GITHUB_REF" = refs/heads/main ] && [ -z "${PUSH_BEFORE//0/}" ]; then
                      range="$GITHUB_SHA"
                  elif ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
                      if [ "$GITHUB_REF" = refs/heads/main ]; then
                          echo "::error::main moved from $PUSH_BEFORE, a commit this checkout does not hold"
                          exit 1
                      fi
                      range="origin/main..$GITHUB_SHA"
                  fi
                  ./mvnw -B -s settings.xml -N exec:exec@release -Drelease.args="check-commits $range"

            # A release is refused unless the tag is exactly 'v' plus the version it carries, and that is no snapshot.
            - name: The tag names this commit's release
              if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
              run: |
                  set -eu
                  VERSION="$(sed -n 's|^    <version>\(.*\)</version>$|\1|p' pom.xml | head -1)"
                  [ -n "$VERSION" ] || { echo "::error::no version in pom.xml"; exit 1; }
                  [ "$GITHUB_REF_NAME" = "v$VERSION" ] \
                      || { echo "::error::the tag $GITHUB_REF_NAME is not v$VERSION, the version this commit carries"; exit 1; }
                  case "$VERSION" in
                      *-SNAPSHOT) echo "::error::$VERSION is a snapshot; a release carries its own version"; exit 1 ;;
                  esac

            # Every -SNAPSHOT in the effective pom - dependencies, the imported BOMs, plugins and their dependencies such as
            # porelo-release, inactive profiles too - refuses the tag.
            - name: A release depends only on releases
              if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
              run: |
                  ./mvnw -B -s settings.xml help:effective-pom -Doutput=target/effective-pom.xml
                  ./mvnw -B -s settings.xml -N exec:exec@check-releases
